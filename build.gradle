if (chaoGameTestDimensions) {
    neoForge.addModdingDependenciesTo(sourceSets.gameTestDimensions)
    tasks.named('processGameTestDimensionsResources').configure {
        doLast {
            def parser = new groovy.json.JsonSlurper()
            def fixture = parser.parse(layout.buildDirectory.file('resources/gameTestDimensions/data/minecraft/worldgen/world_preset/flat.json').get().asFile)
            def vanilla = parser.parse(project.file('art/fixtures/vanilla_flat_preset_1211.json'))
            def realms = ['hub', 'kindergarten', 'garden', 'hero_garden', 'dark_garden']
            def expected = vanilla.dimensions.keySet() + realms.collect { 'chao_garden:' + it }
            if (fixture.dimensions.keySet() != expected.toSet()) {
                throw new GradleException('Development FLAT preset must contain exactly vanilla3 plus the five authored Chao realms')
            }
            vanilla.dimensions.each { id, definition ->
                if (fixture.dimensions[id] != definition) throw new GradleException('Development fixture altered vanilla dimension ' + id)
            }
            realms.each { room ->
                def definition = parser.parse(project.file('src/main/resources/data/chao_garden/dimension/' + room + '.json'))
                if (fixture.dimensions['chao_garden:' + room] != definition) throw new GradleException('Development fixture differs from production realm ' + room)
            }
            logger.lifecycle('Chao0.25.5 development dimension fixture: eight exact definitions; normal runtime override remains excluded')
        }
    }
}

if (variantFixturesEnabled) {
    neoForge.addModdingDependenciesTo(sourceSets.variantFixtures)
    def identityFixture = neoForge.mods.create('chao_variant_fixtures') {
        sourceSet(sourceSets.variantFixtures)
    }
    neoForge.runs.configureEach {
        if (name in ['client', 'gameTestServer']) {
            loadedMods.set([neoForge.mods.getByName(project.mod_id), identityFixture])
            systemProperty 'chao_garden.variantFixtureProfile', 'true'
        } else {
            loadedMods.set([neoForge.mods.getByName(project.mod_id)])
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Lionfish 3.1 samples the rattle arm; dependency remains a separate install.
    implementation files("libs/lionfishapi-3.1.jar")
    if (project.findProperty('chaoShaderTest')?.toString()?.toBoolean()) {
        localRuntime fileTree(dir: project.findProperty('chaoShaderDir') ?: 'dev-mods/shaders', include: ['*.jar'])
    }
    // The bootstrap-free catalog tests parse the same JSON as the running mod.
    testImplementation 'com.google.code.gson:gson:2.10.1'
    if (project.findProperty('chaoAccessoriesTest')?.toString()?.toBoolean()) {
        localRuntime fileTree(dir: project.findProperty('chaoAccessoriesDir') ?: 'dev-mods/accessories',
                include: ['accessories-neoforge-*.jar', 'owo-lib-neoforge-*.jar'])
    }
    if (project.findProperty('chaoLootrTest')?.toString()?.toBoolean()) {
        localRuntime fileTree(dir: project.findProperty('chaoLootrDir') ?: 'dev-mods/lootr',
                include: ['lootr-neoforge-*.jar'])
    }
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
