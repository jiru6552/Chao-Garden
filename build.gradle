plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// The vanilla GameTest server replaces the dimension registry with FLAT's
// definitions. Its exact preset fixture belongs only to that development run.
// Ordinary clients and the installable JAR exercise the real datapack bake.
def chaoGameTestDimensions = gradle.startParameter.taskNames.any {
    it.tokenize(':').last() == 'runGameTestServer'
}
if (chaoGameTestDimensions && gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'runClient' }) {
    throw new GradleException('Run the GameTest server and ordinary client in separate Gradle invocations')
}

// Keep the vanilla-preset override physically outside every ordinary resource
// root. ModDev also discovers raw resource folders, so Copy exclusions alone
// cannot establish this boundary.
if (chaoGameTestDimensions) {
    sourceSets.create('gameTestDimensions') {
        java.setSrcDirs([])
        resources.setSrcDirs(['src/gameTestDimensions/resources'])
    }
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
    exclude 'data/minecraft/worldgen/world_preset/flat.json'
}

tasks.named('processResources').configure {
    inputs.property('chaoGameTestDimensions', chaoGameTestDimensions)
    exclude 'data/minecraft/worldgen/world_preset/flat.json'
    doFirst {
        project.delete(layout.buildDirectory.file('resources/main/data/minecraft/worldgen/world_preset/flat.json').get().asFile)
    }
    doLast {
        def preset = layout.buildDirectory.file('resources/main/data/minecraft/worldgen/world_preset/flat.json').get().asFile
        project.delete(preset)
        if (preset.exists()) throw new GradleException('Development dimension preset remains in main runtime resources')
        logger.lifecycle("Chao dimension fixture: ${chaoGameTestDimensions ? 'isolated GameTest source set' : 'excluded from normal runtime'}")
        logger.lifecycle("Chao dimension fixture output: ${preset.canonicalPath}; exists=${preset.exists()}; resource destination=${destinationDir.canonicalPath}")
    }
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// An opt-in synthetic mod-list fixture exercises the integration gates without
// linking or redistributing any third-party mod. Its output is a separate source
// set and is never part of the installable Chao Garden jar.
def variantFixturesEnabled = providers.gradleProperty('chaoVariantFixtures')
        .map { it.toBoolean() }.getOrElse(false)
if (variantFixturesEnabled) {
    def fixtureCatalog = layout.projectDirectory.file(
            'src/main/resources/assets/chao_garden/chao_variants.json').asFile
    def fixtureGenerated = layout.buildDirectory.dir('generated/variantFixtures').get().asFile
    def generateVariantFixtures = tasks.register('generateVariantFixtureSources') {
        inputs.file fixtureCatalog
        outputs.dir fixtureGenerated
        doLast {
            def catalog = new groovy.json.JsonSlurper().parse(fixtureCatalog)
            def definitions = catalog instanceof List ? catalog : catalog.variants
            def ids = definitions.collectMany { it.mods }.toSet().sort()
            def javaDir = new File(fixtureGenerated, 'java/com/chaogarden/variantfixtures')
            def metadataDir = new File(fixtureGenerated, 'resources/META-INF')
            javaDir.mkdirs()
            metadataDir.mkdirs()
            def source = new StringBuilder('''package com.chaogarden.variantfixtures;
import net.neoforged.fml.common.Mod;
/** Synthetic identity-only fixtures. These are not implementations of the named mods. */
@Mod("chao_variant_fixtures")
public final class VariantFixtureEntrypoints {
  public VariantFixtureEntrypoints() {}
''')
            ids.eachWithIndex { id, index ->
                source.append('  @Mod("').append(id).append('")\n')
                source.append('  public static final class Identity').append(index)
                        .append(' { public Identity').append(index).append('() {} }\n')
            }
            source.append('}\n')
            new File(javaDir, 'VariantFixtureEntrypoints.java').text = source.toString()
            def metadata = new StringBuilder('''modLoader="javafml"
loaderVersion="[1,)"
license="All Rights Reserved"
''')
            (['chao_variant_fixtures'] + ids).each { id ->
                metadata.append('''
[[mods]]
modId="''').append(id).append('''"
version="0.0.0-test-fixture"
displayName="Identity-only Chao gate test: ''').append(id).append('''"
description="Development fixture only; no third-party mod behavior is implemented."
''')
            }
            new File(metadataDir, 'neoforge.mods.toml').text = metadata.toString()
        }
    }
    sourceSets.create('variantFixtures') {
        java.setSrcDirs([new File(fixtureGenerated, 'java')])
        resources.setSrcDirs([new File(fixtureGenerated, 'resources')])
    }
    tasks.named('compileVariantFixturesJava').configure { dependsOn generateVariantFixtures }
    tasks.named('processVariantFixturesResources').configure { dependsOn generateVariantFixtures }
}

