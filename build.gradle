// Development fixtures stay available to Gradle runs and out of the installable mod.
tasks.named('jar', Jar) {
    // Development environments that mirror the workspace can keep the hot
    // archive outside that mirror and publish its verified closed bytes later.
    if (project.hasProperty('chaoArchiveStagingDir')) {
        destinationDirectory = project.file(project.property('chaoArchiveStagingDir'))
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    // A successful task must publish a complete readable archive before any
    // downstream run or release manifest can treat it as an installable mod.
    doLast {
        def archive = archiveFile.get().asFile
        def entries = new HashSet<String>()
        def buffer = new byte[65536]
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            zip.entries().each { entry ->
                if (!entries.add(entry.name)) {
                    throw new GradleException('Duplicate production JAR entry: ' + entry.name)
                }
                if (!entry.isDirectory()) {
                    def crc = new java.util.zip.CRC32()
                    long bytes = 0
                    zip.getInputStream(entry).withCloseable { input ->
                        int count
                        while ((count = input.read(buffer)) != -1) {
                            crc.update(buffer, 0, count)
                            bytes += count
                        }
                    }
                    if (crc.value != entry.crc || bytes != entry.size) {
                        throw new GradleException('Incomplete or corrupt production JAR entry: ' + entry.name)
                    }
                }
            }
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        archive.withInputStream { input ->
            int count
            while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        logger.lifecycle('Production JAR integrity: complete central directory, unique entries and all CRCs verified; entries=' +
                entries.size() + '; bytes=' + archive.length() + '; sha256=' + digest.digest().encodeHex())
    }
    exclude 'com/chaogarden/test/**'
    exclude 'com/chaogarden/client/*VisualSmoke*.class'
    exclude 'com/chaogarden/client/*VisualStudy*.class'
    exclude 'com/chaogarden/client/*CaptureStudy*.class'
    exclude 'com/chaogarden/client/*PoseProbe*.class'
    exclude 'com/chaogarden/client/*VisualProbe*.class'
    exclude 'com/chaogarden/client/ChaoVisualSmoke*.class'
    exclude 'com/chaogarden/client/MechanicsVisualSmoke*.class'
    exclude 'com/chaogarden/client/RefinementVisualSmoke*.class'
    exclude 'com/chaogarden/client/IconVisualSmoke*.class'
    exclude 'com/chaogarden/client/CollectionVisualSmoke*.class'
    exclude 'com/chaogarden/client/ReleaseVisualSmoke*.class'
    exclude 'com/chaogarden/client/DimensionSeedVisualSmoke*.class'
    exclude 'com/chaogarden/client/LocomotionVisualSmoke*.class'
    exclude 'com/chaogarden/client/MarketPolishVisualSmoke*.class'
    exclude 'com/chaogarden/client/ExperienceVisualSmoke*.class'
    exclude 'data/chao_garden/structure/empty.nbt'
    exclude 'data/chao_garden/structure/activity_test.nbt'
    exclude 'data/chao_rattle_tests/**'
    exclude 'data/chao_organ44/**'
    exclude 'data/chao_guitar45/**'
    exclude 'data/chao_instruments48/**'
    exclude 'data/chao_toys49/**'
    exclude 'data/chao_floor49/**'
    exclude 'data/chao_retired49/**'
    exclude 'data/chao_hats50/**'
    exclude 'data/chao_dna50/**'
